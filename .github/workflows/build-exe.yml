name: Build Standalone Executable (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows x64 Portable .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Type-check & run unit tests
        run: |
          bun run lint
          npx --yes tsx --test src/utils/bilingual.test.ts src/utils/competitiveness.test.ts src/utils/resumeLogic.test.ts src/utils/versionDiff.test.ts

      - name: Build single-file Windows .exe
        run: bun run build:exe

      - name: Upload .exe build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResumeCraft-win-x64
          path: release/ResumeCraft-win-x64.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/ResumeCraft-win-x64.exe
